<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>签到中心 · Check-in Hub</title>
<style>
  :root{
    --bg:#eef1f7;--card:#ffffff;--ink:#161a23;--muted:#7b8494;--line:#e9ecf3;
    --green:#0ea472;--green-bg:#e3f7f0;--amber:#c07a12;--amber-bg:#fdf2de;--red:#d0453f;--red-bg:#fdeceb;
    --primary:#5b5bd6;--primary2:#7c6cf0;--shadow:0 10px 34px rgba(35,42,70,.08);--shadow-h:0 18px 46px rgba(35,42,70,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;position:relative;overflow-x:hidden}
  button{cursor:pointer;font-family:inherit;transition:all .18s ease}
  .deco{position:fixed;border-radius:50%;filter:blur(80px);opacity:.5;pointer-events:none;z-index:0}
  .deco.a{width:420px;height:420px;background:#c9d4ff;top:-140px;left:-100px}
  .deco.b{width:380px;height:380px;background:#e5d4ff;bottom:-160px;right:-80px}
  .deco.c{width:280px;height:280px;background:#c8f0e4;top:45%;left:55%;opacity:.35}

  /* ---------- 登录 ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1}
  .login{position:relative;width:100%;max-width:400px;background:rgba(255,255,255,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:40px 36px 32px;text-align:center;box-shadow:var(--shadow-h)}
  .logo{width:60px;height:60px;margin:0 auto 18px;border-radius:18px;background:linear-gradient(135deg,var(--primary2),var(--primary));box-shadow:0 8px 22px rgba(91,91,214,.35);display:flex;align-items:center;justify-content:center}
  .logo svg{width:32px;height:32px}
  .login h1{font-size:22px;font-weight:700;letter-spacing:-.4px}
  .login .sub{font-size:13px;color:var(--muted);margin:6px 0 26px}
  .field{position:relative;margin-bottom:12px}
  .field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8}
  .login input{width:100%;font-size:14px;padding:13px 14px 13px 40px;border:1px solid var(--line);border-radius:12px;outline:none;background:rgba(255,255,255,.75);color:var(--ink);transition:.2s}
  .login input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,91,214,.12);background:#fff}
  .login input::placeholder{color:#a8afbd}
  .code-row{display:flex;gap:9px}
  .code-row input{flex:1}
  .btn{border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--primary2),var(--primary));box-shadow:0 6px 16px rgba(91,91,214,.24);width:100%}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(91,91,214,.32)}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .btn-ghost{width:auto;white-space:nowrap;padding:0 15px;font-size:13px;background:rgba(255,255,255,.9);color:var(--primary);border:1px solid #d8d9f6;box-shadow:none}
  .btn-ghost:hover{background:#fff}
  .okmsg{font-size:12px;color:var(--green);min-height:16px;margin:2px 0 8px;text-align:left;padding-left:2px}
  .err{font-size:12px;color:var(--red);min-height:16px;margin-top:10px;text-align:center}
  .pin-toggle{margin-top:18px;font-size:12px;color:var(--muted);cursor:pointer;transition:.2s}
  .pin-toggle:hover{color:var(--primary)}
  .pin-box{margin-top:12px;padding-top:16px;border-top:1px solid var(--line)}

  /* ---------- 主应用 ---------- */
  .app{max-width:1180px;margin:0 auto;padding:34px 26px 40px;display:none;position:relative;z-index:1}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
  .brandbar{display:flex;align-items:center;gap:13px}
  .brandbar .logo{width:44px;height:44px;border-radius:13px;margin:0}
  .brandbar .logo svg{width:24px;height:24px}
  .brandbar h1{font-size:21px;font-weight:700;letter-spacing:-.3px}
  .brandbar .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .brandbar .meta b{color:var(--ink);font-weight:600}
  .hd-actions{display:flex;align-items:center;gap:9px}
  .user-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 13px 7px 9px;font-size:12px;color:var(--muted)}
  .avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--primary2),var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .icon-btn{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:13px;color:var(--ink)}
  .icon-btn:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
  .icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

  /* 概览 */
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px 19px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .stat::after{content:"";position:absolute;right:-18px;top:-18px;width:74px;height:74px;border-radius:50%;background:var(--tint,#eef1f7);opacity:.6}
  .stat .lbl{font-size:12px;color:var(--muted);margin-bottom:8px;position:relative;z-index:1}
  .stat .num{font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1;position:relative;z-index:1}
  .stat .num small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
  .stat .foot{font-size:11px;color:var(--muted);margin-top:9px;position:relative;z-index:1}
  .stat .foot .pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px;box-shadow:0 0 0 3px var(--green-bg)}

  .section{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .section h2{font-size:15px;font-weight:700}
  .section .line{flex:1;height:1px;background:var(--line)}

  /* 平台卡片 */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:17px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:var(--shadow);transition:.22s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bc,#ccc)}
  .card-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .picon{width:42px;height:42px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;letter-spacing:-.5px;background:var(--bg-brand,#333);box-shadow:0 5px 14px rgba(0,0,0,.1)}
  .pname{flex:1;min-width:0}
  .pname h3{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sel{font-size:12px;padding:6px 9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);max-width:130px;outline:none;cursor:pointer}
  .sel:focus{border-color:var(--primary)}
  .status-row{display:flex;align-items:center;gap:9px;margin-bottom:16px;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 11px;border-radius:99px;font-weight:600}
  .badge .bd{width:6px;height:6px;border-radius:50%;background:currentColor}
  .b-ok{color:var(--green);background:var(--green-bg)}.b-wait{color:var(--amber);background:var(--amber-bg)}.b-warn{color:var(--red);background:var(--red-bg)}
  .note-txt{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
  .metric{background:linear-gradient(145deg,#f7f8fc,#f1f3f9);border:1px solid #eef0f6;border-radius:12px;padding:13px 15px}
  .metric .lbl{font-size:11px;color:var(--muted);margin-bottom:5px}
  .metric .val{font-size:23px;font-weight:700;letter-spacing:-.6px;line-height:1.1}
  .metric .val.txt{font-size:18px;font-weight:600;letter-spacing:0}
  .metric .val span{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
  .actions{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap}
  .actions button{border-radius:9px;padding:8px 12px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .actions button:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
  .actions .primary{background:linear-gradient(135deg,var(--primary2),var(--primary));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(91,91,214,.22)}
  .actions .primary:hover{color:#fff;box-shadow:0 7px 16px rgba(91,91,214,.3)}
  .actions .danger:hover{border-color:var(--red);color:var(--red)}
  .sched{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:12px}
  .sched::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary);flex-shrink:0}
  .logs{border-top:1px dashed var(--line);padding-top:12px}
  .logs .t{font-size:11px;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:6px}
  .logs .t::before{content:"";width:12px;height:2px;border-radius:2px;background:var(--primary);opacity:.5}
  .logs pre{font-size:11px;color:#6a7282;white-space:pre-wrap;word-break:break-all;line-height:1.75;max-height:92px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  .empty-card{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .empty{font-size:12px;color:var(--muted)}
  footer{margin-top:30px;font-size:11px;color:#9aa1ae;text-align:center}

  /* 反馈 */
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);background:#1c2030;color:#fff;padding:11px 20px;border-radius:11px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 12px 30px rgba(0,0,0,.2)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal{position:fixed;inset:0;background:rgba(18,22,35,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal .box{background:#fff;border-radius:18px;padding:0;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow-h);overflow:hidden}
  .modal .mhead{padding:24px 26px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
  .modal .mhead .picon{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;background:var(--bg-brand,linear-gradient(135deg,#5b5bd6,#4338ca))}
  .modal .mhead h3{font-size:17px;font-weight:700;line-height:1.3}
  .modal .mhead .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .modal .mclose{margin-left:auto;border:none;background:#f1f3f9;color:var(--muted);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:16px;line-height:1;flex:0 0 auto}
  .modal .mclose:hover{background:#e6e9f2;color:var(--ink)}
  .modal .mbody{padding:6px 26px 18px;overflow:auto;flex:1}
  .modal .mfoot{padding:16px 26px 22px;border-top:1px solid var(--line);display:flex;gap:10px}
  .modal .mfoot button{flex:1;border-radius:10px;padding:11px;font-size:13px;font-weight:600;border:1px solid var(--line);cursor:pointer}
  .modal .mfoot .cancel{background:#fff;color:var(--ink)}
  .modal .mfoot .save{background:linear-gradient(135deg,var(--primary2),var(--primary));color:#fff;border-color:transparent}
  .modal .mfoot .save:disabled{opacity:.6;cursor:not-allowed}
  .fgroup{margin-top:16px}
  .fgroup>.gt{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--primary);text-transform:uppercase;margin-bottom:2px;display:flex;align-items:center;gap:7px}
  .fgroup>.gt::after{content:"";flex:1;height:1px;background:var(--line)}
  .modal label{font-size:12px;color:var(--ink);display:block;margin:12px 0 5px;font-weight:600}
  .modal label .req{color:#e11d48;margin-left:2px}
  .modal label .opt{color:var(--muted);font-weight:400;font-size:11px;margin-left:4px}
  .fwrap{position:relative}
  .modal input,.modal textarea,.modal select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;background:#fafbfe;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
  .modal input:focus,.modal textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,91,214,.1)}
  .modal input.invalid{border-color:#e11d48;box-shadow:0 0 0 3px rgba(225,29,72,.1)}
  .fwrap.has-pw input{padding-right:42px}
  .pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:7px;font-size:12px}
  .pw-toggle:hover{background:#eef0f7;color:var(--ink)}
  .fhelp{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
  .fhint{background:linear-gradient(135deg,#f0f3ff,#fafbff);border:1px solid #dfe4ff;border-radius:11px;padding:11px 13px;font-size:12px;color:#4b4f8a;line-height:1.55;margin-top:16px}
  .fhint b{color:var(--primary)}
  .verify-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600}
  .verify-badge.ok{background:#e8f8ef;color:#0a8f4d}
  .verify-badge.fail{background:#fdecef;color:#c81e3a}
  .mtabs{display:flex;gap:6px;padding:12px 26px 0;border-bottom:1px solid var(--line);background:#fafbfe}
  .mtab{border:none;background:transparent;padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:8px 8px 0 0}
  .mtab:hover{color:var(--ink)}
  .mtab.active{color:var(--primary);border-bottom-color:var(--primary);background:#fff}
  .oauth-box{margin-top:14px;padding:15px;border:1px solid #dfe4ff;border-radius:13px;background:linear-gradient(135deg,#f5f7ff,#ffffff)}
  .oauth-desc{font-size:12px;color:#4b5563;line-height:1.55;margin-bottom:10px}
  .oauth-step{margin-top:12px;padding:13px;border-radius:11px;background:#fff;border:1px solid var(--line)}
  .oauth-code{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;background:#f3f4ff;color:var(--primary);font-family:ui-monospace,Consolas,monospace;font-size:16px;font-weight:700;letter-spacing:1.5px;margin:8px 0}
  .oauth-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .oauth-btns a,.oauth-btns button{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 14px;border-radius:9px;font-size:12px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .oauth-btns a.primary,.oauth-btns button.primary{background:linear-gradient(135deg,var(--primary2),var(--primary));color:#fff;border-color:transparent}
  .oauth-status{margin-top:10px;font-size:12px;color:var(--primary);display:flex;align-items:center;gap:7px}
  .oauth-status.err{color:var(--red)}
  .oauth-status.ok{color:var(--green)}
  .acct-cnt{font-size:11px;font-weight:600;color:var(--primary);background:#eef0ff;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}
  .spin{animation:sp .9s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:760px){.summary{grid-template-columns:repeat(2,1fr)}.app{padding:22px 16px}.hd-actions{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="deco a"></div><div class="deco b"></div><div class="deco c"></div>

<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 2l2.4 5.2 5.6.6-4.2 3.8 1.2 5.6L12 14.5 7 17.2l1.2-5.6L4 7.8l5.6-.6L12 2z" fill="#fff"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8 2 2-2 2 2 2-3 3-2-2-2 2"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 6.3"/><path d="M20 4v7h-7"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M10 4H5v16h5"/><path d="M15 8l4 4-4 4M19 12H9"/></symbol>
</defs></svg>

<div class="login-wrap" id="loginView">
  <div class="login">
    <div class="logo"><svg><use href="#i-logo"/></svg></div>
    <h1>签到中心</h1>
    <p class="sub" id="loginSubtitle">邮箱验证码登录</p>
    <div class="field"><svg><use href="#i-mail"/></svg><input type="email" id="email" autocomplete="email" placeholder="输入邮箱地址"></div>
    <div class="field" style="margin-bottom:0"><svg><use href="#i-lock"/></svg>
      <div class="code-row" style="width:100%">
        <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码" maxlength="6" style="padding-left:40px">
        <button class="btn btn-ghost" id="sendBtn">获取验证码</button>
      </div>
    </div>
    <div class="okmsg" id="sendMsg"></div>
    <button class="btn" id="loginBtn">登录</button>
    <div class="err" id="loginErr"></div>
    <div class="pin-toggle" id="pinToggle">使用应急 PIN 登录</div>
    <div class="pin-box" id="pinBox" style="display:none">
      <div class="field"><svg><use href="#i-key"/></svg><input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="应急 PIN" maxlength="12"></div>
      <button class="btn" id="pinLoginBtn">PIN 登录</button>
    </div>
  </div>
</div>

<div class="app" id="appView">
  <div class="topbar">
    <div class="brandbar">
      <div class="logo"><svg><use href="#i-logo"/></svg></div>
      <div>
        <h1>签到中心</h1>
        <div class="meta">服务器 <b id="serverHost">—</b> · 更新于 <b id="updated">—</b> · <span id="refresh"></span></div>
      </div>
    </div>
    <div class="hd-actions">
      <div class="user-chip"><span class="avatar" id="avatar">U</span><span id="userLabel">—</span></div>
      <button class="icon-btn" id="checkinAllBtn" onclick="doCheckinAll()">全部签到</button>
      <button class="icon-btn" onclick="load()"><svg><use href="#i-refresh"/></svg>刷新</button>
      <button class="icon-btn" id="logoutBtn"><svg><use href="#i-out"/></svg>退出</button>
    </div>
  </div>

  <div class="summary" id="summary"></div>
  <div class="section"><h2>平台状态</h2><div class="line"></div></div>
  <div class="grid" id="grid"></div>
  <footer>数据来自服务器实时只读查询 · 自动签到由 cron 独立执行 · 支持多账号切换</footer>
</div>

<div class="modal" id="modal">
  <div class="box">
    <div class="mhead">
      <div class="picon" id="modalIcon">+</div>
      <div>
        <h3 id="modalTitle">添加账号</h3>
        <div class="sub" id="modalSub">填写凭据后会自动验证是否可用</div>
      </div>
      <button class="mclose" onclick="closeModal()" title="关闭">×</button>
    </div>
    <div class="mtabs" id="modalTabs" style="display:none">
      <button type="button" class="mtab" data-tab="oauth" onclick="switchModalTab('oauth')">授权登录（推荐）</button>
      <button type="button" class="mtab" data-tab="manual" onclick="switchModalTab('manual')">手动填写</button>
      <button type="button" class="mtab" data-tab="batch" onclick="switchModalTab('batch')">批量导入</button>
    </div>
    <div class="mbody">
      <div id="nameRow">
        <label>账号名称 <span class="opt">便于区分多个账号（留空自动命名）</span></label>
        <input id="f_name" placeholder="例如：主号 / 小号 / 国际版">
      </div>
      <div id="paneOauth" style="display:none">
        <div class="oauth-box">
          <div class="oauth-desc" id="oauthDesc"></div>
          <div id="oauthOpts"></div>
          <div class="oauth-btns" id="oauthStartWrap">
            <button type="button" class="primary" id="oauthStartBtn" onclick="startOAuth()">发起授权登录</button>
          </div>
          <div class="oauth-step" id="oauthStep" style="display:none">
            <div style="font-size:12px;color:#374151;line-height:1.5" id="oauthTip"></div>
            <div id="oauthCodeWrap" style="display:none">
              <div style="font-size:11px;color:var(--muted);margin-top:8px">设备验证码：</div>
              <div class="oauth-code"><span id="oauthCode"></span><button type="button" style="border:none;background:transparent;color:var(--primary);font-size:11px;cursor:pointer" onclick="copyText($('oauthCode').textContent,'验证码已复制')">复制</button></div>
            </div>
            <div class="oauth-btns">
              <a id="oauthLink" class="primary" href="#" target="_blank" rel="noopener noreferrer">打开授权页面</a>
              <button type="button" onclick="copyText($('oauthLink').href,'授权链接已复制，建议粘贴到无痕窗口登录')">复制链接（无痕登录）</button>
              <button type="button" onclick="cancelOAuth()">取消重试</button>
            </div>
            <div class="oauth-status" id="oauthStatus"><span class="spin">⟳</span> 等待完成授权…</div>
          </div>
        </div>
      </div>
      <div id="paneManual">
        <div id="dynamicFields"></div>
      </div>
      <div id="paneBatch" style="display:none">
        <label>批量账号数据 <span class="opt">支持 JSON 数组或每行一条（自动按 UID/Token 去重合并）</span></label>
        <textarea id="f_batch" style="min-height:150px;font-family:ui-monospace,Consolas,monospace;font-size:12px" placeholder=""></textarea>
        <div class="fhelp" id="batchHelp"></div>
        <label style="display:flex;align-items:center;gap:7px;font-weight:500;cursor:pointer;margin-top:10px">
          <input type="checkbox" id="f_batch_verify" style="width:auto"> 导入后逐个验证凭据（账号多时略慢）
        </label>
      </div>
      <div class="fhint" id="modalHint"></div>
    </div>
    <div class="mfoot">
      <button class="cancel" onclick="closeModal()">关闭</button>
      <button class="save" id="saveBtn">保存并验证</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const BRAND={
  workbuddy:{tag:'WB',bg:'linear-gradient(135deg,#4f8cff,#1d4ed8)',bc:'#3b82f6'},
  trae:{tag:'TR',bg:'linear-gradient(135deg,#a78bfa,#6d28d9)',bc:'#8b5cf6'},
  qoder:{tag:'QD',bg:'linear-gradient(135deg,#22d3ee,#0e7490)',bc:'#06b6d4'},
  minimax:{tag:'MM',bg:'linear-gradient(135deg,#fb923c,#c2410c)',bc:'#f97316'},
  codearts:{tag:'CA',bg:'linear-gradient(135deg,#60a5fa,#1e40af)',bc:'#2563eb'}
};
const STATUS={ok:{label:'今日已签',cls:'b-ok'},wait:{label:'待领取',cls:'b-wait'},warn:{label:'需关注',cls:'b-warn'}};
// 字段定义与在线授权插件从后端 /api/account-schema 拉取（单一真相源），避免前后端漂移
let SCHEMA={},DATA=null,curModalPlatform=null,curEditId=null,curModalTab='manual';
let oauthSessionId=null,oauthPollTimer=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m,ms){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms||2300);}
function copyText(txt,msg){
  if(!txt)return;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast(msg||'已复制')).catch(()=>toast('复制失败，请手动复制'));}
  else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg||'已复制');}catch(e){toast('复制失败');}document.body.removeChild(ta);}
}
function stClass(a){return a.ok?(a.checked_in?'ok':'wait'):'warn';}
function metric(l,v,u){const isTxt=!u&&typeof v==='string'&&v!=='—';return `<div class="metric"><div class="lbl">${esc(l)}</div><div class="val${isTxt?' txt':''}">${v??'—'}${u?`<span>${esc(u)}</span>`:''}</div></div>`;}
function curAcct(p){return (p.accounts||[]).find(x=>x._sel)||(p.accounts||[]).find(x=>x.enabled)||(p.accounts||[])[0];}

async function api(path,opts={}){
  const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  if(r.status===401){showLogin();throw new Error('未登录');}
  return r.json();
}
let sendTimer=null;
async function sendCode(){
  const email=$('email').value.trim().toLowerCase();
  if(!email){$('sendMsg').textContent='';$('loginErr').textContent='请先输入邮箱';return;}
  $('loginErr').textContent='';
  const btn=$('sendBtn');btn.disabled=true;
  try{
    const r=await fetch('/api/send-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const d=await r.json();
    if(d.ok){
      $('sendMsg').style.color='var(--green)';
      $('sendMsg').textContent=(d.note||'已发送')+'，5 分钟内有效';
      let n=60;btn.textContent=n+'s';
      clearInterval(sendTimer);
      sendTimer=setInterval(()=>{n--;if(n<=0){clearInterval(sendTimer);btn.disabled=false;btn.textContent='重新发送';}else btn.textContent=n+'s';},1000);
    }else{$('sendMsg').style.color='var(--red)';$('sendMsg').textContent=d.note||'发送失败';btn.disabled=false;btn.textContent='获取验证码';}
  }catch(e){$('sendMsg').style.color='var(--red)';$('sendMsg').textContent='网络错误';btn.disabled=false;btn.textContent='获取验证码';}
}
async function login(){
  const email=$('email').value.trim().toLowerCase(),code=$('code').value.trim();
  if(!email||!code){$('loginErr').textContent='请填邮箱和验证码';return;}
  $('loginBtn').disabled=true;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,code})});
    const d=await r.json();
    if(d.ok)enterApp();else $('loginErr').textContent=d.note||'验证码错误';
  }catch(e){$('loginErr').textContent='网络错误';}
  $('loginBtn').disabled=false;
}
async function pinLogin(){
  const pin=$('pin').value.trim();
  if(!pin){$('loginErr').textContent='请输入应急 PIN';return;}
  $('pinLoginBtn').disabled=true;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});
    const d=await r.json();
    if(d.ok)enterApp();else $('loginErr').textContent=d.note||'PIN 错误';
  }catch(e){$('loginErr').textContent='网络错误';}
  $('pinLoginBtn').disabled=false;
}
function enterApp(){
  $('loginView').style.display='none';$('appView').style.display='block';
  if(!Object.keys(SCHEMA).length){api('/api/account-schema').then(d=>{if(d&&d.platforms)SCHEMA=d.platforms;}).catch(()=>{});}
  load();
}
function showLogin(){$('loginView').style.display='flex';$('appView').style.display='none';}

function renderSummary(){
  const ps=DATA.platforms||[];let signedAccts=0,totalAccts=0,today=0,wbTotal=0,wbCnt=0;
  ps.forEach(p=>{
    (p.accounts||[]).forEach(a=>{
      if(!a.enabled)return;
      totalAccts++;
      if(a.ok&&a.checked_in){signedAccts++;today+=(a.daily||0)+(a.extra||0);}
      if(p.key==='workbuddy'){wbCnt++;wbTotal+=(a.total||0);}
    });
  });
  const stats=[
    {lbl:'今日已签账号',num:signedAccts,small:'/ '+totalAccts,foot:totalAccts?(signedAccts===totalAccts?'全部启用账号已完成':'还有 '+(totalAccts-signedAccts)+' 个账号待签'):'尚未添加启用账号',tint:'#e3f7f0'},
    {lbl:'今日获得积分',num:today,small:'分',foot:'汇总所有已签启用账号',tint:'#eaf1fe'},
    {lbl:'累计积分（WB）',num:wbTotal,small:'分',foot:wbCnt>1?('WorkBuddy '+wbCnt+' 个账号合计'):'WorkBuddy 启用账号',tint:'#f3ebff'},
    {lbl:'自动签到',num:'运行中',small:'',foot:'<span class="pulse"></span>cron 定时 · 幂等',tint:'#e3f7f0'}
  ];
  $('summary').innerHTML=stats.map(s=>`<div class="stat" style="--tint:${s.tint}"><div class="lbl">${s.lbl}</div><div class="num">${s.num}${s.small?`<small>${s.small}</small>`:''}</div><div class="foot">${s.foot}</div></div>`).join('');
  const u=DATA.user||'';
  $('userLabel').textContent=u==='应急PIN'?'应急 PIN':(u?u.replace(/^(.{2}).*(@.*)$/,'$1***$2'):'—');
  $('avatar').textContent=(u&&u!=='应急PIN'?u[0]:'U').toUpperCase();
}
function platformCard(p){
  const accts=p.accounts||[];const b=BRAND[p.key]||{tag:'?',bg:'#64748b',bc:'#64748b'};
  const hasOAuth=(p.providers||[]).length>0;
  if(!accts.length)return `<div class="card" style="--bc:${b.bc}"><div class="card-top"><div class="picon" style="--bg-brand:${b.bg}">${b.tag}</div><div class="pname"><h3>${esc(p.label)}</h3></div></div><div class="status-row"><span class="note-txt">暂无账号</span></div><div class="actions"><button class="primary" onclick="openModal('${p.key}')">${hasOAuth?'+ 授权/添加账号':'+ 添加账号'}</button></div></div>`;
  const a=curAcct(p),s=STATUS[stClass(a)]||STATUS.warn;
  let m='';
  if(p.key==='workbuddy')m=metric('连签',a.streak,'天')+metric('累计积分',a.total,'分');
  else if(p.key==='trae')m=metric('今日积分',a.daily,'分')+metric('额外奖励',a.extra,'分');
  else if(p.key==='codearts')m=metric('积分余额',a.total,'分')+metric('今日状态',a.checked_in?'已签':'未签','');
  else m=metric('每日积分',a.daily,'分')+metric('今日状态',a.checked_in?'已签':'未签','');
  const opts=accts.map(x=>`<option value="${esc(x.id)}" ${x.id===a.id?'selected':''}>${esc(x.name)}${x.enabled?'':'（停用）'}</option>`).join('');
  const logs=(p.logs||[]).slice(-4).join('\n')||'（暂无记录）';
  const cntBadge=accts.length>1?`<span class="acct-cnt">${accts.length} 账号</span>`:'';
  const reauthBtn=hasOAuth?`<button onclick="reauthAcct('${p.key}','${esc(a.id)}','${esc(a.name||'')}')">重新授权</button>`:'';
  const refreshBtn=(a.has_refresh||p.key==='codearts')?`<button onclick="doRefreshAcct('${p.key}','${esc(a.id)}')">续期</button>`:'';
  return `<div class="card" style="--bc:${b.bc}">
    <div class="card-top">
      <div class="picon" style="--bg-brand:${b.bg}">${b.tag}</div>
      <div class="pname"><h3>${esc(p.label)}${cntBadge}</h3></div>
      <select class="sel" onchange="selectAcct('${p.key}',this.value)">${opts}</select>
    </div>
    <div class="status-row"><span class="badge ${s.cls}"><i class="bd"></i>${s.label}</span><span class="note-txt">${esc(a.note||'')}</span></div>
    <div class="metrics">${m}</div>
    <div class="actions">
      <button class="primary" onclick="doCheckin('${p.key}','${esc(a.id)}')">立即签到</button>
      ${reauthBtn}${refreshBtn}
      <button onclick="toggleAcct('${p.key}','${esc(a.id)}',${!a.enabled})">${a.enabled?'停用':'启用'}</button>
      <button onclick="editAcct('${p.key}','${esc(a.id)}','${esc(a.name||'')}')">编辑</button>
      <button onclick="openModal('${p.key}')">添加</button>
      <button class="danger" onclick="removeAcct('${p.key}','${esc(a.id)}')">删除</button>
    </div>
    <div class="sched">触发时间 ${esc(p.schedule||'—')}</div>
    <div class="logs"><div class="t">最近记录</div><pre>${esc(logs)}</pre></div>
  </div>`;
}
function selectAcct(key,id){const p=DATA.platforms.find(x=>x.key===key);p.accounts.forEach(a=>a._sel=(a.id===id));render();}
function render(){if(!DATA)return;$('serverHost').textContent=location.host||'本机';$('updated').textContent=DATA.updated||'—';renderSummary();$('grid').innerHTML=DATA.platforms.map(platformCard).join('');}
async function load(){
  const r=$('refresh');r.innerHTML='<span class="spin">⟳</span> 刷新中';
  try{DATA=await api('/api/status?t='+Date.now());render();r.textContent='已刷新';}
  catch(e){if(e.message!=='未登录')r.textContent='刷新失败';}
}
async function doCheckin(pk,id){
  toast('正在签到…');
  try{const d=await api('/api/checkin',{method:'POST',body:JSON.stringify({platform:pk,id})});toast((d.ok?'成功：':'失败：')+d.note);setTimeout(load,800);}
  catch(e){if(e.message!=='未登录')toast('签到出错');}
}
async function doCheckinAll(){
  const btn=$('checkinAllBtn');const old=btn.textContent;
  btn.disabled=true;btn.textContent='签到中…';toast('正在批量签到，稍等…');
  try{
    const d=await api('/api/checkin-all',{method:'POST',body:JSON.stringify({})});
    const fail=(d.results||[]).filter(r=>!r.ok);
    let msg='批量完成：'+d.done+'/'+d.total+' 成功';
    if(fail.length)msg+='（失败：'+fail.map(r=>r.label+'-'+r.name).join('、')+'）';
    toast(msg,5200);
    setTimeout(load,600);
  }catch(e){if(e.message!=='未登录')toast('批量签到出错');}
  finally{btn.disabled=false;btn.textContent=old;}
}
async function toggleAcct(pk,id,en){await api('/api/accounts/toggle',{method:'POST',body:JSON.stringify({platform:pk,id,enabled:en})});toast(en?'已启用':'已停用');load();}
async function removeAcct(pk,id){if(!confirm('确认删除这个账号？'))return;await api('/api/accounts/remove',{method:'POST',body:JSON.stringify({platform:pk,id})});toast('已删除');load();}
// 字段分组：按 key 把字段切成若干组，让长表单（CodeArts）更易读
function fieldGroups(pk,fields){
  if(pk==='codearts')return [
    {name:'鉴权凭据',keys:['accessKey','secretKey','securityToken']},
    {name:'自动续期材料',keys:['expiresAt','refreshToken','codeVerifier','dpopD','dpopX','dpopY']}
  ];
  if(pk==='qoder')return [{name:'登录凭据',keys:fields.map(f=>f.key)},{name:'设备指纹（多账号各自独立）',keys:['__device__']}];
  return [{name:'账号凭据',keys:fields.map(f=>f.key)}];
}
function makeField(f,val){
  const wrap=document.createElement('div');
  const lab=document.createElement('label');
  lab.textContent=f.label;
  if(f.required){const r=document.createElement('span');r.className='req';r.textContent='*';lab.appendChild(r);}
  else{const o=document.createElement('span');o.className='opt';o.textContent='可选';lab.appendChild(o);}
  wrap.appendChild(lab);
  const fw=document.createElement('div');fw.className='fwrap'+(f.sensitive?' has-pw':'');
  const inp=document.createElement('input');
  inp.type=f.sensitive?'password':'text';
  inp.dataset.key=f.key;
  inp.autocomplete='off';
  if(f.placeholder)inp.placeholder=f.placeholder;
  if(val!=null&&String(val).trim())inp.value=String(val);
  else if(f.default)inp.value=f.default;
  if(f.sensitive){
    const tg=document.createElement('button');tg.type='button';tg.className='pw-toggle';tg.textContent='显示';
    tg.onclick=()=>{const show=inp.type==='password';inp.type=show?'text':'password';tg.textContent=show?'隐藏':'显示';};
    fw.appendChild(inp);fw.appendChild(tg);
  }else fw.appendChild(inp);
  wrap.appendChild(fw);
  if(f.help){const h=document.createElement('div');h.className='fhelp';h.textContent=f.help;wrap.appendChild(h);}
  return wrap;
}
async function doRefreshAcct(pk,id){
  toast('正在续期凭据…');
  try{
    const d=await api('/api/accounts/refresh',{method:'POST',body:JSON.stringify({platform:pk,id})});
    toast((d.ok?'✓ ':'失败：')+(d.note||''),3500);
    if(d.ok)setTimeout(load,500);
  }catch(e){if(e.message!=='未登录')toast('续期请求出错');}
}
function stopOAuthPoll(){
  if(oauthPollTimer){clearTimeout(oauthPollTimer);oauthPollTimer=null;}
}
async function cancelOAuth(){
  stopOAuthPoll();
  if(oauthSessionId){
    const sid=oauthSessionId;oauthSessionId=null;
    fetch('/api/auth/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid})}).catch(()=>{});
  }
  $('oauthStep').style.display='none';
  $('oauthStartWrap').style.display='flex';
  $('oauthStartBtn').disabled=false;
  $('oauthStartBtn').textContent='发起授权登录';
}
function curProviders(pk){
  const s=SCHEMA[pk];if(s&&s.providers&&s.providers.length)return s.providers;
  const p=(DATA&&DATA.platforms||[]).find(x=>x.key===pk);
  return (p&&p.providers)||[];
}
function renderOAuthPane(pk){
  const provs=curProviders(pk);
  const prov=provs[0];
  if(!prov)return;
  $('oauthDesc').textContent=prov.description||'通过官方页面完成授权登录';
  const wrap=$('oauthOpts');wrap.innerHTML='';
  if(provs.length>1){
    const lab=document.createElement('label');lab.textContent='登录方式';wrap.appendChild(lab);
    const sel=document.createElement('select');sel.id='oauthProviderSel';
    provs.forEach(p=>{const o=document.createElement('option');o.value=p.provider_id;o.textContent=p.label;sel.appendChild(o);});
    wrap.appendChild(sel);
  }
  (prov.options||[]).forEach(opt=>{
    const lab=document.createElement('label');lab.textContent=opt.label;wrap.appendChild(lab);
    const sel=document.createElement('select');sel.dataset.optKey=opt.key;
    (opt.choices||[]).forEach(ch=>{
      const o=document.createElement('option');o.value=ch.value;o.textContent=ch.label;
      if(ch.value===opt.default)o.selected=true;
      sel.appendChild(o);
    });
    wrap.appendChild(sel);
  });
  $('oauthStep').style.display='none';
  $('oauthStartWrap').style.display='flex';
  $('oauthStartBtn').disabled=false;
  $('oauthStartBtn').textContent=curEditId?'发起重新授权':'发起授权登录';
}
async function startOAuth(){
  const provs=curProviders(curModalPlatform);
  if(!provs.length){toast('该平台暂不支持在线授权');return;}
  const provId=($('oauthProviderSel')&&$('oauthProviderSel').value)||provs[0].provider_id;
  const options={};
  $('oauthOpts').querySelectorAll('[data-opt-key]').forEach(el=>{options[el.dataset.optKey]=el.value;});
  const btn=$('oauthStartBtn');btn.disabled=true;btn.innerHTML='<span class="spin">◌</span> 正在生成链接…';
  try{
    const d=await api('/api/auth/start',{method:'POST',body:JSON.stringify({
      platform:curModalPlatform,provider_id:provId,options,
      account_id:curEditId||'',name:$('f_name').value.trim()
    })});
    if(!d.ok){toast(d.note||'发起授权失败',3500);btn.disabled=false;btn.textContent='重试发起授权';return;}
    oauthSessionId=d.session_id;
    $('oauthTip').textContent=d.tip||'请打开下方链接完成登录授权';
    $('oauthLink').href=d.auth_url;
    if(d.user_code){$('oauthCode').textContent=d.user_code;$('oauthCodeWrap').style.display='block';}
    else $('oauthCodeWrap').style.display='none';
    $('oauthStatus').className='oauth-status';
    $('oauthStatus').innerHTML='<span class="spin">⟳</span> 等待用户在浏览器中完成授权…';
    $('oauthStartWrap').style.display='none';
    $('oauthStep').style.display='block';
    scheduleOAuthPoll(Math.max(2000,(d.poll_interval||3)*1000));
  }catch(e){
    if(e.message!=='未登录')toast('发起授权出错');
    btn.disabled=false;btn.textContent='发起授权登录';
  }
}
function scheduleOAuthPoll(ms){
  stopOAuthPoll();
  oauthPollTimer=setTimeout(pollOAuth,ms);
}
async function pollOAuth(){
  if(!oauthSessionId)return;
  try{
    const d=await api('/api/auth/poll',{method:'POST',body:JSON.stringify({
      session_id:oauthSessionId,auto_save:true,
      account_id:curEditId||'',name:$('f_name').value.trim()
    })});
    if(d.status==='pending'){
      $('oauthStatus').className='oauth-status';
      $('oauthStatus').innerHTML='<span class="spin">⟳</span> '+esc(d.note||'等待完成授权…');
      scheduleOAuthPoll(3000);
      return;
    }
    oauthSessionId=null;
    if(d.status==='success'){
      $('oauthStatus').className='oauth-status ok';
      $('oauthStatus').textContent='✓ '+(d.note||'授权成功');
      toast(d.verified?('✓ '+d.name+' 授权并验证通过'):(d.name+' 已保存，但验证未通过：'+(d.verifyNote||'')),4200);
      setTimeout(()=>{closeModal();load();},700);
      return;
    }
    $('oauthStatus').className='oauth-status err';
    $('oauthStatus').textContent='✕ '+(d.note||'授权已过期或失败，请点击取消重试');
  }catch(e){
    if(e.message!=='未登录')scheduleOAuthPoll(4000);
  }
}
const BATCH_PLACEHOLDER={
  workbuddy:'每行一个账号（备注|accessToken|uid|refreshToken|domain），或直接粘贴 JSON 数组：\n主号|eyJ...|uid123|rt_xxx|www.workbuddy.cn\n国际小号|eyJ...|uid456|rt_yyy|www.workbuddy.ai',
  minimax:'每行一个账号（备注|accessToken|refreshToken），或粘贴 JSON 数组：\n主号|token1|rt1',
  qoder:'每行一个账号（备注|accessToken|refreshToken|uid），或粘贴 JSON 数组',
  trae:'每行一个账号（备注|token|userId|refreshToken|deviceId|machineId），或粘贴 JSON 数组',
  codearts:'请粘贴 JSON 数组：[{"name":"主号","accessKey":"...","secretKey":"...","securityToken":"...","refreshToken":"...","codeVerifier":"...","dpopD":"...","dpopX":"...","dpopY":"..."}]'
};
function switchModalTab(tab){
  curModalTab=tab;
  $('modalTabs').querySelectorAll('.mtab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  $('paneOauth').style.display=tab==='oauth'?'block':'none';
  $('paneManual').style.display=tab==='manual'?'block':'none';
  $('paneBatch').style.display=tab==='batch'?'block':'none';
  $('nameRow').style.display=tab==='batch'?'none':'block';
  $('saveBtn').style.display=tab==='oauth'?'none':'block';
  if(tab==='batch')$('saveBtn').textContent='开始批量导入';
  else $('saveBtn').textContent='保存并验证';
  if(tab==='oauth'){
    $('modalHint').innerHTML='<b>多账号技巧：</b>点击「复制链接（无痕登录）」并在浏览器无痕/隐私窗口打开，可连续登录多个不同账号而互不覆盖。';
  }else if(tab==='batch'){
    $('modalHint').innerHTML='支持开源社区 <b>备注|AT|uid|RT</b> 格式与标准 JSON 数组；已存在的同 UID/Token 账号会自动更新，不会重复创建。';
  }else{
    $('modalHint').innerHTML=curEditId?'敏感项显示为空表示保留原值；如需修改请重新填入。保存后自动验证。':'凭据仅保存在服务器 <b>vault.json</b>（权限 600），不会写进日志或前端。敏感项可点「显示」切换明文。';
  }
}
async function openModal(pk,defaultTab){
  cancelOAuth();
  curModalPlatform=pk;curEditId=null;
  const info=(SCHEMA[pk]||{});const fields=info.fields||[];const b=BRAND[pk]||{tag:'?',bg:'#64748b'};
  const hasOAuth=curProviders(pk).length>0;
  $('modalIcon').textContent=b.tag;$('modalIcon').style.setProperty('--bg-brand',b.bg);
  $('modalTitle').textContent='添加账号 · '+(info.label||pk);
  $('modalSub').textContent=hasOAuth?'支持网页授权登录、手动填写或批量导入':'填写凭据或批量导入，保存后自动验证';
  $('f_name').value='';
  $('f_batch').value='';
  $('f_batch').placeholder=BATCH_PLACEHOLDER[pk]||'粘贴 JSON 数组';
  $('batchHelp').textContent='兼容 JSON（支持 access_token / refresh_token 字段自动转换）及竖线分隔文本。';
  renderFields(pk,fields,{});
  if(hasOAuth)renderOAuthPane(pk);
  $('modalTabs').style.display='flex';
  $('modalTabs').querySelector('[data-tab="oauth"]').style.display=hasOAuth?'inline-block':'none';
  $('modalTabs').querySelector('[data-tab="batch"]').style.display='inline-block';
  switchModalTab(defaultTab||(hasOAuth?'oauth':'manual'));
  $('modal').style.display='flex';
}
async function reauthAcct(pk,id,name){
  cancelOAuth();
  curModalPlatform=pk;curEditId=id;
  const info=(SCHEMA[pk]||{});const fields=info.fields||[];const b=BRAND[pk]||{tag:'?',bg:'#64748b'};
  $('modalIcon').textContent=b.tag;$('modalIcon').style.setProperty('--bg-brand',b.bg);
  $('modalTitle').textContent='重新授权 · '+(info.label||pk);
  $('modalSub').textContent='授权完成后将自动更新该账号的新 Token';
  $('f_name').value=name||'';
  renderFields(pk,fields,{});
  renderOAuthPane(pk);
  $('modalTabs').style.display='flex';
  $('modalTabs').querySelector('[data-tab="oauth"]').style.display='inline-block';
  $('modalTabs').querySelector('[data-tab="batch"]').style.display='none';
  switchModalTab('oauth');
  $('modal').style.display='flex';
}
async function editAcct(pk,id,name){
  cancelOAuth();
  curModalPlatform=pk;curEditId=id;
  const info=(SCHEMA[pk]||{});const fields=info.fields||[];const b=BRAND[pk]||{tag:'?',bg:'#64748b'};
  const hasOAuth=curProviders(pk).length>0;
  $('modalIcon').textContent=b.tag;$('modalIcon').style.setProperty('--bg-brand',b.bg);
  $('modalTitle').textContent='编辑账号 · '+(info.label||pk);
  $('modalSub').textContent='留空的敏感项将保留原值';
  $('f_name').value=name||'';
  try{
    const d=await api('/api/account-detail?platform='+encodeURIComponent(pk)+'&id='+encodeURIComponent(id));
    renderFields(pk,fields,d.account||{});
  }catch(e){renderFields(pk,fields,{});toast('读取账号详情失败');}
  if(hasOAuth)renderOAuthPane(pk);
  $('modalTabs').style.display=hasOAuth?'flex':'none';
  $('modalTabs').querySelector('[data-tab="oauth"]').style.display=hasOAuth?'inline-block':'none';
  $('modalTabs').querySelector('[data-tab="batch"]').style.display='none';
  switchModalTab('manual');
  $('modal').style.display='flex';
}
function renderFields(pk,fields,vals){
  const wrap=$('dynamicFields');wrap.innerHTML='';
  const byKey={};fields.forEach(f=>byKey[f.key]=f);
  fieldGroups(pk,fields).forEach(g=>{
    const grp=document.createElement('div');grp.className='fgroup';
    const t=document.createElement('div');t.className='gt';t.textContent=g.name;grp.appendChild(t);
    g.keys.forEach(k=>{
      if(k==='__device__'){
        const lab=document.createElement('label');lab.innerHTML='设备信息 JSON <span class="opt">从本机 01_extract.py 输出复制</span>';grp.appendChild(lab);
        const ta=document.createElement('textarea');ta.id='f_device';ta.dataset.key='__device__';
        ta.style.minHeight='80px';ta.style.fontFamily='monospace';
        ta.placeholder='{"machineId":"...","machineToken":"...","machineOS":"x86_64_windows",...}';
        if(vals.device&&typeof vals.device==='object')ta.value=JSON.stringify(vals.device);
        grp.appendChild(ta);
      }else{
        const f=byKey[k];if(f)grp.appendChild(makeField(f,vals[k]));
      }
    });
    wrap.appendChild(grp);
  });
}
function closeModal(){cancelOAuth();$('modal').style.display='none';curEditId=null;}
async function saveAccount(){
  if(curModalTab==='batch'){
    const raw=$('f_batch').value.trim();
    if(!raw){toast('请粘贴要导入的账号数据');return;}
    const btn=$('saveBtn');btn.disabled=true;btn.innerHTML='<span class="spin">◌</span> 正在导入…';
    try{
      const d=await api('/api/accounts/import',{method:'POST',body:JSON.stringify({
        platform:curModalPlatform,raw,verify:$('f_batch_verify').checked
      })});
      if(d.ok){
        let msg=`导入完成：新增 ${d.added}，更新 ${d.updated}`;
        if(d.errors&&d.errors.length)msg+=`（${d.errors.length} 条失败：${d.errors[0]}）`;
        toast(msg,4800);
        closeModal();load();
      }else toast('导入失败：'+(d.note||'未知原因'),4000);
    }catch(e){toast('导入出错：'+(e.message||''));}
    finally{btn.disabled=false;btn.textContent='开始批量导入';}
    return;
  }
  const account={};
  $('dynamicFields').querySelectorAll('input[data-key]').forEach(i=>{
    if(i.value.trim())account[i.dataset.key]=i.value.trim();
  });
  // 前端必填校验（编辑模式下敏感项留空允许保留原值）
  const fields=(SCHEMA[curModalPlatform]||{}).fields||[];
  let bad=null;
  for(const f of fields){
    if(f.required&&!(curEditId&&f.sensitive)&&!String(account[f.key]||'').trim()){
      const inp=$('dynamicFields').querySelector('input[data-key="'+f.key+'"]');
      if(inp)inp.classList.add('invalid');
      if(!bad)bad=f.label;
    }
  }
  if(bad){toast('请填写：'+bad);return;}
  const body={platform:curModalPlatform,name:$('f_name').value.trim()||'新账号',account};
  if(curEditId)body.id=curEditId;
  // Qoder 设备指纹按账号独立保存
  const devEl=$('f_device');
  if(curModalPlatform==='qoder'&&devEl&&devEl.value.trim()){
    try{body.device=JSON.parse(devEl.value.trim());}
    catch(e){toast('设备信息不是合法 JSON');devEl.classList.add('invalid');return;}
  }
  const btn=$('saveBtn');btn.disabled=true;btn.innerHTML='<span class="spin">◌</span> 保存并验证…';
  try{
    const ep=curEditId?'/api/accounts/update':'/api/accounts/add';
    const d=await api(ep,{method:'POST',body:JSON.stringify(body)});
    if(d.ok){
      closeModal();
      if(d.verified)toast('✓ '+(curEditId?'已更新':'已添加')+'，凭据验证通过');
      else toast((curEditId?'已更新':'已添加')+'，但验证未通过：'+(d.verifyNote||'未知'));
      load();
    }else toast('保存失败：'+(d.note||'未知原因'));
  }catch(e){toast('保存出错：'+(e.message||''));}
  finally{btn.disabled=false;btn.textContent='保存并验证';}
}
$('loginBtn').onclick=login;
$('sendBtn').onclick=sendCode;
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
$('pinLoginBtn').onclick=pinLogin;
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')pinLogin();});
$('pinToggle').onclick=()=>{const b=$('pinBox');b.style.display=b.style.display==='none'?'block':'none';};
$('logoutBtn').onclick=async()=>{await api('/api/logout',{method:'POST',body:'{}'});$('code').value='';$('pin').value='';showLogin();};
$('saveBtn').onclick=saveAccount;
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal();});
(async()=>{
  try{
    const info=await (await fetch('/api/login-info')).json();
    if(info.dry_run)$('loginSubtitle').textContent='邮箱验证码登录 · 测试模式';
    else if(!info.mail_ready)$('loginSubtitle').textContent='邮箱登录未配置，请用应急 PIN';
  }catch(e){}
  fetch('/api/status').then(r=>{if(r.ok)enterApp();});
})();
setInterval(()=>{if($('appView').style.display!=='none')load();},60000);
</script>
